# FIB 1H untuk BOT TESTNET — tanpa laptop, tanpa alert TradingView.
# Tiap jam 3 menit sesudah lilin 1H tutup (+ cadangan menit 33): hitung setup FIB 1H di watchlist
# dan kirim keadaannya ke bot (POST /fib). Order dipasang & dikelola oleh bot (cron 5 menit).
# Rahasia (Settings -> Secrets -> Actions): BOT_URL, BOT_KUNCI (= WEBHOOK_KUNCI di Cloudflare).
name: fib-1h-bot
on:
  schedule:
    - cron: "3 * * * *"
    - cron: "33 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fib-1h
  cancel-in-progress: true
jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Hitung setup FIB 1H & kirim ke bot
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          BOT_KUNCI: ${{ secrets.BOT_KUNCI }}
        run: node notif/fib_1h.cjs
