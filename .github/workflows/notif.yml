# Notifikasi Telegram pola 4H baru — AMONK. Jalan tiap 4 jam, 7 menit sesudah lilin 4H tutup (UTC).
# Tidak butuh laptop/Claude. Rahasia: TELEGRAM_TOKEN, TELEGRAM_CHAT (Settings -> Secrets -> Actions).
name: notif-pola-4h
on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      uji:
        description: "Kirim 1 pesan UJI (pola valid terbaru dari semua koin), tidak mengubah status"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: notif-pola
  cancel-in-progress: false
jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Cek pola & kirim Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          UJI: ${{ inputs.uji }}
        run: node notif/notif_pola.cjs
      - name: Simpan status terkirim
        run: |
          git config user.name "amonk-notif"
          git config user.email "amonk-notif@users.noreply.github.com"
          git add notif/terkirim.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "notif: status terkirim"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
