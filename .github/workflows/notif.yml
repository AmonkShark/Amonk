# Notifikasi Telegram AMONK SINYAL — tanpa laptop/Claude.
#  - tiap 4 jam, 7 menit sesudah lilin 4H tutup (UTC): pola baru + update exit (TP1/TP2/SL/BE)
#  - jadwal CADANGAN 30 menit kemudian (GitHub kadang menunda/melewati cron; run 04:07 22-09 hilang).
#    Skrip anti-duplikat (terkirim.json), jadi dua run berturut tidak mengirim pesan ganda.
#  - Minggu 13:00 UTC (20:00 WIB): rekap mingguan
# Rahasia (Settings -> Secrets -> Actions): TELEGRAM_TOKEN, TELEGRAM_CHAT, AKUN_URL, SANDI_APP
#   (opsional MODAL_USDT, RISIKO_PCT).
name: notif-pola-4h
on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"
    - cron: "37 0,4,8,12,16,20 * * *"
    - cron: "0 13 * * 0"
    - cron: "12 16-21 * * *" # SCAN HARIAN 4H & 1D: skrip kirim sekali saat pukul 04:xx Australia/Sydney (ikut daylight saving)
  workflow_dispatch:
    inputs:
      uji:
        description: "Kirim 1 pesan UJI (pola valid terbaru dari semua koin), tidak mengubah status"
        type: boolean
        default: false
      rekap:
        description: "Kirim REKAP mingguan sekarang"
        type: boolean
        default: false
      scan:
        description: "Kirim SCAN HARIAN 4H & 1D sekarang (valid di area entry + hampir valid)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: notif-pola
  cancel-in-progress: false
jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Cek pola, exit, rekap & kirim Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          AKUN_URL: ${{ secrets.AKUN_URL }}
          SANDI_APP: ${{ secrets.SANDI_APP }}
          MODAL_USDT: ${{ secrets.MODAL_USDT }}
          RISIKO_PCT: ${{ secrets.RISIKO_PCT }}
          CARA_UKURAN: ${{ secrets.CARA_UKURAN }}
          BAGI_MODAL: ${{ secrets.BAGI_MODAL }}
          UJI: ${{ inputs.uji }}
          REKAP: ${{ inputs.rekap }}
          SCAN: ${{ inputs.scan }}
          JADWAL: ${{ github.event.schedule }}
        run: node notif/notif_pola.cjs
      - name: Simpan status & catatan maju
        run: |
          git config user.name "amonk-notif"
          git config user.email "amonk-notif@users.noreply.github.com"
          git add notif/terkirim.json notif/maju.json notif/audit.json notif/scan.json notif/peringkat.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "notif: status & catatan maju"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
